<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Konijnenklas: maaltijden en opvang</title>
  <link rel="icon" href="img/konijn.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icoon-180.png">
  <link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-700.woff2" as="font" type="font/woff2" crossorigin>
  <script>document.documentElement.dataset.thema = /(?:^|; )thema=donker/.test(document.cookie) ? 'donker' : 'licht';</script>
  <script>(function () {
    var h = document.documentElement, c = (document.cookie.match(/(?:^|; )taal=(nl|en|fr|de|es|it|ko)\b/) || [])[1] || 'nl';
    h.dataset.taal = c;
    h.lang = { nl: 'nl-BE', en: 'en-GB', fr: 'fr-BE', de: 'de-DE', es: 'es-ES', it: 'it-IT', ko: 'ko-KR' }[c];
    if (c !== 'nl') h.classList.add('vertalen');
  })();</script>
  <link rel="stylesheet" href="css/stijl.css">
  <script src="js/vendor/supabase.js" defer></script>
  <script type="module" src="js/ouder.js"></script>
</head>
<body>
  <div class="demo-band" id="demoBand" data-t="demoBand" hidden>Demo: niets wordt echt verstuurd</div>
  <header class="kop">
    <div class="kop-binnen">
      <img class="logo" src="img/konijn.svg" alt="">
      <div>
        <div class="kop-titel" id="klasTitel">Konijnenklas</div>
        <div class="kop-sub" id="schoolTitel" data-t="kopSub">Maaltijden en opvang</div>
      </div>
      <div class="kop-rechts">
        <label class="taal-knop"><span id="taalCode" aria-hidden="true">NL</span><select id="taal" data-t-label="taal" aria-label="Taal"></select></label>
        <button class="thema-knop" type="button" id="themaKnop"></button>
      </div>
    </div>
  </header>

  <main class="inhoud">
    <section class="kaart start" id="start">
      <h1 data-t="kopSub">Maaltijden en opvang</h1>
      <p class="uitleg" data-t="startUitleg">Kies de klas en de naam van je kind.</p>

      <label for="klas" data-t="labelKlas">Klas</label>
      <select id="klas"><option value="" data-t="laden">Even geduld…</option></select>

      <label for="kind" data-t="labelKind">Naam van je kind</label>
      <select id="kind" disabled><option value="" data-t="eerstKlas">Kies eerst de klas</option></select>

      <form id="controle" hidden>
        <label for="achternaam" data-t="labelAchternaam">Typ ter controle de achternaam van je kind</label>
        <p class="hulp" id="achternaamHulp" data-t="achternaamHulp">Zo zijn we zeker dat niemand per vergissing voor een ander kind invult.</p>
        <input type="text" id="achternaam" aria-describedby="achternaamHulp" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
        <p class="fout" id="startFout" role="alert"></p>
        <button class="knop hoofd breed" type="submit" id="verder" data-t="verder">Verder</button>
      </form>
    </section>

    <section id="werk" hidden>
      <div class="kind-balk">
        <p class="kind-naam"><span class="klein" data-t="voor">Voor</span> <b id="kindNaam"></b></p>
        <button class="link" type="button" id="anderKind" data-t="anderKind">Ander kind</button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabMaaltijden" aria-controls="paneelMaaltijden" aria-selected="true" data-t="tabMaaltijden">Maaltijden</button>
        <button class="tab" role="tab" id="tabOpvang" aria-controls="paneelOpvang" aria-selected="false" data-t="tabOpvang">Opvang</button>
      </div>

      <div class="paneel" id="paneelMaaltijden" role="tabpanel" aria-labelledby="tabMaaltijden"></div>
      <div class="paneel" id="paneelOpvang" role="tabpanel" aria-labelledby="tabOpvang" hidden></div>
    </section>
  </main>

  <footer class="voet">© <span class="jaar">2026</span> <a href="https://lvit.be" target="_blank" rel="noopener">Lode Verschelde</a></footer>
  <script>document.querySelectorAll('.jaar').forEach((j) => { j.textContent = new Date().getFullYear(); });</script>

  <dialog id="bevestig">
    <form method="dialog">
      <h2 id="bevestigTitel"></h2>
      <div id="bevestigTekst"></div>
      <div class="dialoog-knoppen">
        <button class="knop" value="nee" data-t="annuleren">Annuleren</button>
        <button class="knop hoofd" value="ja">Versturen</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
