<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Konijnenklas">
  <title>Konijnenklas: leerkracht</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../img/konijn.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../img/icoon-180.png">
  <link rel="preload" href="../fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/atkinson-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/stijl.css">
  <script src="../js/vendor/supabase.js" defer></script>
  <script type="module" src="../js/leerkracht.js"></script>
</head>
<body>
  <div class="demo-band" id="demoBand" hidden>Demo: wachtwoord "konijn", niets wordt echt bewaard</div>
  <header class="kop">
    <div class="kop-binnen">
      <img class="logo" src="../img/konijn.svg" alt="">
      <div>
        <div class="kop-titel" id="klasTitel">Konijnenklas</div>
        <div class="kop-sub">Leerkracht</div>
      </div>
      <button class="link kop-rechts" type="button" id="afmelden" hidden>Afmelden</button>
    </div>
  </header>

  <main class="inhoud">
    <section class="kaart start" id="aanmelden" hidden>
      <h1>Aanmelden</h1>
      <form id="aanmeldForm">
        <label for="wachtwoord">Wachtwoord</label>
        <input type="password" id="wachtwoord" autocomplete="current-password" enterkeyhint="go">
        <p class="fout" id="aanmeldFout" role="alert"></p>
        <button class="knop hoofd breed" type="submit">Aanmelden</button>
      </form>
    </section>

    <section id="app" hidden>
      <nav class="nav" role="tablist">
        <button class="tab" role="tab" data-scherm="kinderen">Kinderen</button>
        <button class="tab" role="tab" data-scherm="klas">Klas</button>
        <button class="tab" role="tab" data-scherm="vrij">Vrije dagen</button>
        <button class="tab" role="tab" data-scherm="meldingen">Meldingen</button>
      </nav>
      <div id="scherm"></div>
    </section>
  </main>

  <dialog id="bevestig">
    <form method="dialog">
      <h2 id="bevestigTitel"></h2>
      <div id="bevestigTekst"></div>
      <div class="dialoog-knoppen">
        <button class="knop" value="nee">Annuleren</button>
        <button class="knop hoofd" value="ja">OK</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
