# Houdt het gratis Supabase-project wakker. Supabase pauzeert een gratis project
# na een week zonder verkeer; dan laadt de site geen gegevens meer (gebeurd op 2026-11-08).
# Elke dag één leesopdracht via de openbare functie ouder_klassen, met de publieke sleutel uit js/config.js.
name: Supabase wakker houden

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # Ook bij een push die dit bestand wijzigt: de tokens op de Mac mogen geen Action met de hand starten.
  push:
    branches: [main]
    paths: ['.github/workflows/supabase-wakker.yml']

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database aanroepen
        run: |
          code=$(curl -s -o antwoord.txt -w '%{http_code}' -m 30 -X POST \
            'https://nhpfvjkptfghldibteer.supabase.co/rest/v1/rpc/ouder_klassen' \
            -H 'apikey: sb_publishable_h8zZ0UK7LkSjloLXjHud1A_Fp9j5GKT' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"
          test "$code" = 200
